<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON Formatter</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5b6470; --border: #e2e5ea; --accent: #3b6ef5; --err: #c62828; --ok: #2e7d32; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --card: #171a21; --text: #e6e8eb; --muted: #9aa3ae; --border: #262b35; --accent: #7b9bff; --err: #ff6b6b; --ok: #66bb6a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 32px 16px; }
    a { color: var(--accent); text-decoration: none; }
    h1 { margin: 12px 0 16px; }
    textarea {
      width: 100%; min-height: 380px; padding: 12px; resize: vertical;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: inherit;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
    button {
      padding: 8px 14px; font: inherit; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: inherit;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    #status { font-size: 14px; color: var(--muted); }
    #status.err { color: var(--err); } #status.ok { color: var(--ok); }
  </style>
</head>
<body>
  <main>
    <a href="../">← All tools</a>
    <h1>🧾 JSON Formatter</h1>
    <textarea id="input" spellcheck="false" placeholder='{"paste": "your JSON here"}'></textarea>
    <div class="bar">
      <button class="primary" id="pretty">Pretty print</button>
      <button id="minify">Minify</button>
      <button id="copy">Copy</button>
      <span id="status"></span>
    </div>
  </main>
  <script>
    const input = document.getElementById("input");
    const status = document.getElementById("status");
    const say = (msg, cls = "") => { status.textContent = msg; status.className = cls; };

    function run(indent) {
      try {
        input.value = JSON.stringify(JSON.parse(input.value), null, indent);
        say("Valid JSON ✓", "ok");
      } catch (e) {
        say(e.message, "err");
      }
    }
    document.getElementById("pretty").onclick = () => run(2);
    document.getElementById("minify").onclick = () => run(0);
    document.getElementById("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(input.value); say("Copied", "ok"); }
      catch { say("Copy failed", "err"); }
    };
  </script>
</body>
</html>
