<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Random Tools</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>" />
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470;
      --border: #e2e5ea; --accent: #3b6ef5; --tag: #eef2ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #171a21; --text: #e6e8eb; --muted: #9aa3ae;
        --border: #262b35; --accent: #7b9bff; --tag: #1f2640;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    input[type="search"] {
      width: 100%; padding: 12px 14px; font: inherit; color: inherit;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      outline: none; margin-bottom: 24px;
    }
    input[type="search"]:focus { border-color: var(--accent); }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    a.card {
      display: flex; flex-direction: column; gap: 8px; padding: 18px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
    }
    a.card:hover, a.card:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
    .head { display: flex; align-items: center; gap: 10px; }
    .icon { font-size: 26px; line-height: 1; }
    .name { font-weight: 600; font-size: 17px; }
    .desc { color: var(--muted); font-size: 14px; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--tag); color: var(--accent); }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <main>
    <h1>🧰 Random Tools</h1>
    <p class="sub">My collection of small internal tools.</p>
    <input type="search" id="q" placeholder="Search tools…" autocomplete="off" />
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </main>
  <script>
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const q = document.getElementById("q");
    let tools = [];

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function render() {
      const term = q.value.trim().toLowerCase();
      const list = tools.filter((t) =>
        !term || [t.name, t.description, t.slug, ...t.tags].join(" ").toLowerCase().includes(term));
      grid.innerHTML = list.map((t) => `
        <a class="card" href="./${encodeURIComponent(t.slug)}/">
          <div class="head"><span class="icon">${esc(t.icon)}</span><span class="name">${esc(t.name)}</span></div>
          <div class="desc">${esc(t.description)}</div>
          ${t.tags.length ? `<div class="tags">${t.tags.map((g) => `<span class="tag">${esc(g)}</span>`).join("")}</div>` : ""}
        </a>`).join("");
      empty.hidden = list.length > 0;
      empty.textContent = tools.length ? "No tools match your search." : "No tools yet — add a folder with a tool.json.";
    }

    fetch("./tools.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((data) => { tools = data.tools || []; render(); })
      .catch(() => { empty.hidden = false; empty.textContent = "Couldn't load tools.json — run `node scripts/build-manifest.mjs`."; });
    q.addEventListener("input", render);
  </script>
</body>
</html>
